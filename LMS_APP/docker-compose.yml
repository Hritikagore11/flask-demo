services:
  mysql:
    image: mysql:9.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Lms@123
      MYSQL_DATABASE: lms_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  lms-app:
    build: .
    container_name: lms-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Lms@123
      DB_NAME: lms_db

      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data: